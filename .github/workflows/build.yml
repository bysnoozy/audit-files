name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AuditFiles.sln
      - name: Build
        run: dotnet build AuditFiles.sln --no-restore -c Release
      - name: Test
        run: dotnet test tests/AuditFiles.Core.Tests/AuditFiles.Core.Tests.csproj --no-restore -c Release

  publish-windows:
    name: Publish Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish win-x64
        run: dotnet publish src/AuditFiles.App/AuditFiles.App.csproj -c Release -r win-x64 --self-contained false -o publish/win-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuditFiles-win-x64
          path: publish/win-x64
